name: "과제 제출 이슈 자동화 - 심화세션"

on:
  workflow_dispatch:
    inputs:
      session_info:
        description: '세션 제목 (예: 심화세션 0차시)'
        required: true
        default: '00세션 0차시 과제 & 0차시 사전과제'
      assignment_name:
        description: '과제 파일명 (\n으로 구분하여 여러 개 입력 가능)'
        required: true
        default: 'assignment_{주제}.ipynb'
      requirements:
        description: '과제 요구 사항 (\n으로 구분하여 여러 개 입력 가능)'
        required: true
        default: '내용을 입력하세요'
      current_session_assignee:
        description: '이번 차시 담당자 ID - 과제 면제 (공백으로 구분)'
        required: false
        default: ''
      next_session_assignee:
        description: '다음 차시 담당자 ID - 사전과제 면제 (공백으로 구분)'
        required: false
        default: ''

permissions:
  issues: write
  contents: read

jobs:
  create_issues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: "과제 이슈 생성 및 학회원 할당"
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIREMENTS: ${{ github.event.inputs.requirements }}
          ASSIGNMENT_NAME: ${{ github.event.inputs.assignment_name }}
          SESSION_INFO: ${{ github.event.inputs.session_info }}
          CURRENT_ASSIGNEE: ${{ github.event.inputs.current_session_assignee }}
          NEXT_ASSIGNEE: ${{ github.event.inputs.next_session_assignee }}
        run: |
          members=(
            "이지영:jiyoung-0427"
            "고유빈:Yubin-Koh"
            "조수현:chochoalice"
            "조민정:jmj-99"
            "신영은:912eun"
            "권도영:osmund0228"
            "안가은:peanuut24"
            "구준모:kjms1019"
            "장유경:jjang-yukyung"

            "방서영:sy212-894"
            "권유철:kwonyc11"
            "최록희:rookkix"
            "정리나:Jeong-Rina"
            "류시현:sihyun0529"
            "손영현:younghyun729"
            "김지윤:olgayooon"
            "조대흠:damisoda"
            "전수현:suiyon"
            "김희연:hykim12118"
            "한민영:hmy9691-jpg"
            "이수빈:soobeen-lee"
            "김진하:jxxxxnha"
            "김민아:kmeenaa"
            "오규원:gw020328-oss"
          )

          read -ra CURRENT_LIST <<< "$CURRENT_ASSIGNEE"
          read -ra NEXT_LIST <<< "$NEXT_ASSIGNEE"

          is_in_list() {
            local target="$1"
            shift
            for item in "$@"; do
              [ "$(echo "$item" | xargs)" = "$target" ] && return 0
            done
            return 1
          }

          for info in "${members[@]}"; do
            name=$(echo $info | cut -d':' -f1 | xargs)
            id=$(echo $info | cut -d':' -f2 | xargs)

            # 면제 여부 판단
            exempt_assign=false
            exempt_req=false
            is_in_list "$id" "${CURRENT_LIST[@]}" && exempt_assign=true
            is_in_list "$id" "${NEXT_LIST[@]}"    && exempt_req=true

            # 과제 섹션
            if $exempt_assign; then
              ASSIGN_SECTION="### 🔍 과제
          > 😊 이번 차시 담당자로 과제가 면제됩니다."
            else
              FORMATTED_ASSIGN=$(echo -e "$ASSIGNMENT_NAME" | sed 's/^/- [ ] /')
              ASSIGN_SECTION="### 🔍 과제
          $FORMATTED_ASSIGN"
            fi

            # 사전과제 섹션
            if $exempt_req; then
              REQ_SECTION="### 🔍 사전과제 요구사항
          > 😊 다음 차시 담당자로 사전과제가 면제됩니다."
            else
              FORMATTED_REQ=$(echo -e "$REQUIREMENTS" | sed 's/^/- [ ] /')
              REQ_SECTION="### 🔍 사전과제 요구사항
          $FORMATTED_REQ"
            fi

            issue_body=$(cat <<EOF
          $ASSIGN_SECTION

          $REQ_SECTION

          ### ✅ 과제 제출 확인 사항
          - [ ] 본인의 브랜치에서 작업하고 add, commit, push 했나요?
          - [ ] develop <- 본인 브랜치로 pull request 했나요?
          EOF
            )

            echo "Creating issue for $name ($id)..."
            gh api repos/$GITHUB_REPOSITORY/issues \
              --method POST \
              -f title="[submit] $SESSION_INFO: $name" \
              -f body="$issue_body" \
              -f "assignees[]=$id" \
              -f "labels[]=submit"

            sleep 1
          done